[project]
name = "ms-ad-mcp"
version = "0.3.0"
description = "Read-only MCP servers for the Microsoft Active Directory family: AD DS (adds-mcp), ADCS (adcs-mcp), and AD DNS (addns-mcp)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "ldap3>=2.9.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "cryptography>=42.0",
    "requests>=2.31",
]

[project.optional-dependencies]
adcs = [
    "pypsrp>=0.8.1",
    "requests-kerberos>=0.14",
]
dev = [
    "pytest>=8",
]

[project.scripts]
adds-mcp = "adds_mcp.server:main"
adcs-mcp = "adcs_mcp.server:main"
addns-mcp = "addns_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adds_mcp", "src/adcs_mcp", "src/addns_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
